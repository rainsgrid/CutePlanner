<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Daily Planner & Study Buddy 🌸</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Quicksand', sans-serif; background-color: #fdf2f8; }
    .font-cute { font-family: 'Itim', cursive; }
  </style>
</head>
<body class="min-h-screen text-gray-700 flex items-center justify-center p-4">

  <!-- ================= 1. HALAMAN LOGIN & REGISTER (AWAL) ================= -->
  <div id="auth-page" class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border-4 border-pink-200">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-cute text-pink-500 font-bold mb-1">✨ Cute Planner ✨</h1>
      <p id="auth-subtitle" class="text-sm text-gray-400">Silakan masuk atau daftar untuk mulai mencatat!</p>
    </div>

    <!-- Tombol Google (Praktis) -->
    <button onclick="loginWithGoogle()" class="w-full bg-white border-2 border-pink-200 hover:bg-pink-50 text-gray-700 font-semibold py-2.5 rounded-2xl flex items-center justify-center gap-3 mb-4 transition shadow-sm text-sm">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.3 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.99 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.17 2.7 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
      Masuk / Daftar dengan Google
    </button>

    <div class="flex items-center my-4">
      <div class="flex-1 border-t border-pink-100"></div>
      <span class="px-3 text-xs text-gray-400 font-medium">ATAU EMAIL</span>
      <div class="flex-1 border-t border-pink-100"></div>
    </div>

    <!-- Form Email & Password -->
    <div class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-500 ml-1">Email</label>
        <input type="email" id="email-input" placeholder="nama@email.com" class="w-full px-4 py-2.5 rounded-xl border border-pink-200 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 ml-1">Password</label>
        <input type="password" id="password-input" placeholder="Minimal 6 karakter" class="w-full px-4 py-2.5 rounded-xl border border-pink-200 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300">
      </div>
      
      <button id="main-auth-btn" onclick="handleEmailAuth()" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-2.5 rounded-xl transition shadow-md text-sm mt-2">
        Dftar Akun Baru 🌸
      </button>
    </div>

    <!-- Pindah Mode Daftar / Masuk -->
    <div class="text-center mt-5 text-xs text-gray-500">
      <span id="toggle-text">Sudah punya akun?</span>
      <button onclick="toggleAuthMode()" id="toggle-btn" class="text-pink-500 font-bold ml-1 hover:underline">Masuk di sini</button>
    </div>
  </div>


  <!-- ================= 2. HALAMAN UTAMA PLANNER (SETELAH LOGIN) ================= -->
  <div id="planner-app" class="hidden w-full max-w-4xl bg-white/90 backdrop-blur-md rounded-3xl shadow-xl p-6 border-4 border-pink-200">
    
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row justify-between items-center border-b-2 border-pink-100 pb-4 mb-6 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-cute text-pink-500 font-bold">✨ Cute Daily Planner ✨</h1>
        <p id="welcome-user" class="text-xs md:text-sm text-gray-500">Halo! Semangat belajarnya hari ini ya 💖</p>
      </div>

      <button onclick="logout()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs px-4 py-2 rounded-xl font-semibold transition">
        Keluar (Logout)
      </button>
    </header>

    <!-- KONTEN TO-DO & POMODORO -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- To-Do List -->
      <div class="bg-pink-50/50 p-4 rounded-2xl border border-pink-100">
        <h2 class="text-lg font-cute text-pink-600 mb-3">📝 To-Do List Harian</h2>
        <div class="flex gap-2 mb-3">
          <input type="text" id="task-input" placeholder="Tulis tugas baru..." class="flex-1 px-3 py-2 rounded-xl border border-pink-200 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300">
          <button onclick="addTask()" class="bg-pink-400 hover:bg-pink-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm">+</button>
        </div>
        <ul id="task-list" class="space-y-2 max-h-60 overflow-y-auto"></ul>
      </div>

      <!-- Mini Pomodoro -->
      <div class="bg-purple-50/50 p-4 rounded-2xl border border-purple-100 flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-cute text-purple-600 mb-3">🍅 Mini Pomodoro Fokus</h2>
          <div class="text-center bg-white p-6 rounded-xl border border-purple-200 shadow-sm">
            <div id="timer-display" class="text-4xl font-bold font-cute text-purple-500 mb-3">25:00</div>
            <button onclick="startTimer()" class="bg-purple-400 hover:bg-purple-500 text-white text-xs px-4 py-2 rounded-xl font-bold shadow-sm">Mulai Fokus 🐰</button>
          </div>
        </div>
        <div class="mt-4 text-xs text-center text-purple-400">
          Status: <span id="sync-status" class="font-semibold text-emerald-600">Tersinkron di Cloud ☁️</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= SCRIPTS LOGIKA FIREBASE & APLIKASI ================= -->
  <script>
    // --- KONFIGURASI FIREBASE ---
    const firebaseConfig = {
      apiKey: "MASUKKAN_API_KEY_KAMU",
      authDomain: "PROJECT_ID.firebaseapp.com",
      projectId: "PROJECT_ID",
      storageBucket: "PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let tasks = [];
    let isLoginMode = false; // Status awal: Daftar akun baru

    // --- MENGALIHKAN MODE DAFTAR / MASUK ---
    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      const subtitle = document.getElementById('auth-subtitle');
      const mainBtn = document.getElementById('main-auth-btn');
      const toggleText = document.getElementById('toggle-text');
      const toggleBtn = document.getElementById('toggle-btn');

      if (isLoginMode) {
        subtitle.innerText = "Masukkan akunmu untuk melanjutkan.";
        mainBtn.innerText = "Masuk ✨";
        toggleText.innerText = "Belum punya akun?";
        toggleBtn.innerText = "Daftar di sini";
      } else {
        subtitle.innerText = "Silakan daftar akun baru untuk mulai mencatat!";
        mainBtn.innerText = "Daftar Akun Baru 🌸";
        toggleText.innerText = "Sudah punya akun?";
        toggleBtn.innerText = "Masuk di sini";
      }
    }

    // --- PROSES AUTH EMAIL & PASSWORD ---
    function handleEmailAuth() {
      const email = document.getElementById('email-input').value;
      const password = document.getElementById('password-input').value;

      if (!email || !password) {
        alert("Email dan password tidak boleh kosong ya!");
        return;
      }

      if (isLoginMode) {
        // Proses Login
        auth.signInWithEmailAndPassword(email, password)
          .catch(error => alert("Gagal masuk: " + error.message));
      } else {
        // Proses Daftar
        auth.createUserWithEmailAndPassword(email, password)
          .catch(error => alert("Gagal mendaftar: " + error.message));
      }
    }

    // --- PROSES GOOGLE AUTH ---
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => alert("Gagal login Google: " + error.message));
    }

    // --- LOGOUT ---
    function logout() {
      auth.signOut();
    }

    // --- PANTAU STATUS SESI USER ---
    auth.onAuthStateChanged(user => {
      const authPage = document.getElementById('auth-page');
      const plannerApp = document.getElementById('planner-app');

      if (user) {
        // Jika sudah login: Sembunyikan halaman login, tampilkan aplikasi planner
        currentUser = user;
        authPage.classList.add('hidden');
        plannerApp.classList.remove('hidden');
        document.getElementById('welcome-user').innerText = `Halo, ${user.email} ✨ Semangat belajarnya!`;
        loadDataFromCloud(user.uid);
      } else {
        // Jika belum login: Tampilkan halaman login, sembunyikan aplikasi
        currentUser = null;
        authPage.classList.remove('hidden');
        plannerApp.classList.add('hidden');
        tasks = [];
        renderTasks();
      }
    });

    // --- FUNGSI TO-DO LIST ---
    function renderTasks() {
      const listEl = document.getElementById('task-list');
      listEl.innerHTML = '';
      if (tasks.length === 0) {
        listEl.innerHTML = `<li class="text-xs text-center text-gray-400 py-4">Belum ada tugas. Yuk tambah tugas pertamamu! 🎀</li>`;
        return;
      }
      tasks.forEach((task, index) => {
        listEl.innerHTML += `
          <li class="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-pink-100 text-sm">
            <span class="${task.completed ? 'line-through text-gray-400' : ''}">${task.text}</span>
            <div class="flex gap-2">
              <button onclick="toggleTask(${index})" class="text-xs bg-pink-100 px-2 py-1 rounded-lg text-pink-600">${task.completed ? 'Batal' : 'Selesai'}</button>
              <button onclick="deleteTask(${index})" class="text-xs bg-red-100 px-2 py-1 rounded-lg text-red-500">Hapus</button>
            </div>
          </li>
        `;
      });
      saveDataToCloud();
    }

    function addTask() {
      const input = document.getElementById('task-input');
      if (!input.value.trim()) return;
      tasks.push({ text: input.value, completed: false });
      input.value = '';
      renderTasks();
    }

    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    // --- PENYIMPANAN CLOUD FIRESTORE ---
    function saveDataToCloud() {
      if (!currentUser) return;
      db.collection("planners").doc(currentUser.uid).set({
        tasks: tasks,
        updatedAt: new Date()
      }, { merge: true });
    }

    function loadDataFromCloud(uid) {
      db.collection("planners").doc(uid).get().then(doc => {
        if (doc.exists && doc.data().tasks) {
          tasks = doc.data().tasks;
        } else {
          tasks = [];
        }
        renderTasks();
      });
    }

    // --- TIMER POMODORO ---
    let timerInterval;
    function startTimer() {
      let time = 1500;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        let mins = Math.floor(time / 60);
        let secs = time % 60;
        document.getElementById('timer-display').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        if (time > 0) time--;
        else clearInterval(timerInterval);
      }, 1000);
    }
  </script>
</body>
</html>
